services:
  app:
    build:
      context: .
      args:
        VERSION: ${LB_VERSION:-1.0.0}
    image: lightbacklog:latest
    restart: unless-stopped
    ports:
      # Bound to localhost on purpose: put a reverse proxy with HTTPS in front (see docs/self-hosting.md).
      - "127.0.0.1:8100:8100"
    environment:
      LB_BACKUP_DIR: /backups
    volumes:
      - ./data:/data
      - ./backups:/backups
    # Run as the owner of ./data so the data directory stays private. `make up` sets these for you.
    user: "${LB_UID:-1000}:${LB_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/lightbacklog", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
