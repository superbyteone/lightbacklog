# LightBacklog behind Nginx with HTTPS (example: replace backlog.example.com with your hostname).
# Install: sudo cp deploy/nginx.example.conf /etc/nginx/sites-available/lightbacklog.conf
#          sudo ln -sf /etc/nginx/sites-available/lightbacklog.conf /etc/nginx/sites-enabled/
# First-time certificate (the HTTPS block cannot load before a certificate exists):
#   1. comment out the whole `listen 443` server block below, then: sudo nginx -t && sudo systemctl reload nginx
#   2. sudo mkdir -p /var/www/certbot && sudo certbot certonly --webroot -w /var/www/certbot -d backlog.example.com
#   3. uncomment the block, then: sudo nginx -t && sudo systemctl reload nginx
# Renewals reuse the same webroot (the port-80 server below serves the ACME challenge).

# Zone names must be unique per Nginx server: rename them (and their uses below) if you run several copies.
limit_req_zone $binary_remote_addr zone=lightbacklog_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=lightbacklog_general:10m rate=30r/s;
# Only used if you switch on the "remote MCP access" block below.
limit_req_zone $binary_remote_addr zone=lightbacklog_mcp:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name backlog.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name backlog.example.com;
    server_tokens off;

    # Uploads are capped at 10 MiB by the application; leave room for multipart overhead.
    client_max_body_size 12m;

    ssl_certificate /etc/letsencrypt/live/backlog.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backlog.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # The application sets CSP, X-Frame-Options, X-Content-Type-Options, Referrer-Policy and
    # Permissions-Policy itself; only transport security belongs here.
    add_header Strict-Transport-Security "max-age=31536000" always;

    limit_req zone=lightbacklog_general burst=60 nodelay;
    limit_req_status 429;

    # Default: AI agents talk MCP to the local interface (http://127.0.0.1:8100/mcp), never
    # through the public hostname. The application refuses any proxied /mcp request unless
    # LB_MCP_ALLOWED_CIDRS is set on the server, so leaving this block in place is the safe
    # default even if you forget it -- but it stops requests here too, before they reach the app.
    location = /mcp { return 404; }
    location ^~ /mcp/ { return 404; }

    # --- Remote MCP access (opt-in) -----------------------------------------------------
    # Only if an external system genuinely needs to reach this instance's MCP server: set
    # LB_MCP_ALLOWED_CIDRS on the server to that system's specific IP(s)/CIDR(s), delete the two
    # `return 404` lines above, and uncomment the block below. The application enforces the
    # actual allowlist, a per-token rate limit and an audit log; limit_req here is
    # defense-in-depth on top of that, not the primary control. See docs/self-hosting.md.
    #
    # location = /mcp {
    #     limit_req zone=lightbacklog_mcp burst=20 nodelay;
    #     limit_req_status 429;
    #     proxy_pass http://127.0.0.1:8100;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto https;
    #     proxy_connect_timeout 5s;
    #     proxy_read_timeout 120s;
    # }

    # Slow down credential guessing (the application throttles per account as well).
    location = /api/v1/auth/login {
        limit_req zone=lightbacklog_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Live updates: a long-lived Server-Sent Events stream that must not be buffered or timed out.
    location = /api/v1/events {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
